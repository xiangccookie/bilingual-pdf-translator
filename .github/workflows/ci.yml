name: ci

# 推送 / PR 时做轻量体检：源码能编译、能导入、术语表能载入。
# 这里**不下载 67.5 MB 模型**，所以跑得很快（1-2 分钟）。

on:
  push:
    branches: [main, master]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  check:
    runs-on: windows-latest
    env:
      # GitHub 的 Windows runner 控制台默认不是 UTF-8；
      # 一旦程序 print 中文就会抛 UnicodeEncodeError（实测导致过 CI 失败）。
      # 下面三行把 Python 的 stdio 强制成 UTF-8，并且本文件里的输出尽量只用 ASCII。
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: syntax check (compile every source file)
        shell: pwsh
        run: |
          # 必须列**实际存在**的文件。
          # 之前写了 src/argos_backend.py（已被 local_engine.py 取代并删除），
          # py_compile 报 FileNotFoundError，CI 一直红着。
          $files = @(
            "src/bi_app.py",
            "src/pdf_bilingual.py",
            "src/local_engine.py",
            "src/glossary.py",
            "src/mt_translate.py",
            "tools/install_argos.py",
            "tools/runtime_hook.py"
          )
          $bad = 0
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Host "missing: $f" -ForegroundColor Red; $bad++; continue }
            python -m py_compile $f
            if ($LASTEXITCODE -ne 0) { Write-Host "syntax error: $f" -ForegroundColor Red; $bad++ }
            else { Write-Host "OK $f" }
          }
          if ($bad -gt 0) { throw "$bad file(s) failed syntax check" }

      - name: import check + sentence splitter
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0,'src'); import pdf_bilingual as pb; s=pb.split_sentences('A. B is here. C? D!'); print('split count =', len(s)); assert len(s) >= 2"

      - name: glossary loads and corrects
        shell: pwsh
        run: |
          # 输出保持纯 ASCII，避免 runner 控制台编码问题
          python -c "import sys; sys.path.insert(0,'src'); import glossary as g; p=g.find_glossary_file(); assert p, 'glossary file not found'; gl=g.Glossary.load(p); print('glossary entries =', len(gl)); assert len(gl) > 100; out=gl.apply('The type strains were used.','xingzhuangjunzhu used'); print('apply ok:', out); print('glossary check passed')"

      - name: required files present
        shell: pwsh
        run: |
          # tools/pyi_common.ps1 是打包参数的唯一来源，本地脚本与 CI 都依赖它，
          # 被误删会让两边打包都不完整，所以在这里也守一道。
          foreach ($f in @("README.md","LICENSE","requirements.txt","assets/glossary/biology.tsv","src/local_engine.py","src/glossary.py","tools/pyi_common.ps1","tools/build_exe.ps1","tools/runtime_hook.py")) {
            if (-not (Test-Path $f)) { throw "missing file: $f" }
            Write-Host "found: $f"
          }

      - name: bi_app imports (layout pipeline smoke)
        shell: pwsh
        run: |
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,100),'This is a test sentence. It has two sentences.', fontsize=11); d.save('sample.pdf')"
          python -c "import sys; sys.path.insert(0,'src'); import bi_app; print('bi_app import OK')"
          Write-Host "layout pipeline import OK (a real build needs the 67.5 MB model, skipped here)"
