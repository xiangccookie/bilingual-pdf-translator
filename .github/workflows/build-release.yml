name: build-release

# 打 tag（v1.0.0 这种）时自动打包 Windows 成品并挂到 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}      # 也可以在 Actions 页面手动点一下跑

permissions:
  contents: write            # 需要写入 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 下载离线模型（67.5 MB，不进仓库）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets | Out-Null
          $url = "https://argos-net.com/v1/translate-en_zh-1_9.argosmodel"
          Write-Host "download $url"
          Invoke-WebRequest -Uri $url -OutFile "assets/translate-en_zh.argosmodel" -TimeoutSec 600
          $len = (Get-Item "assets/translate-en_zh.argosmodel").Length
          Write-Host "model bytes $len"
          if ($len -lt 50MB) { throw "model download failed (file too small)" }

      - name: 打包（目录版 + 单文件版，两者都必须含模型与术语表）
        shell: pwsh
        run: |
          # 打包参数是**唯一一份**，来自 tools/pyi_common.ps1（本地脚本也读它）。
          # 历史事故就出在「复制一份」：本地补了 --add-data assets/glossary，CI 那份没跟上，
          # 发布包就静默少了术语表功能。这里只 dot-source，不要再把参数抄进来。
          . (Join-Path $PWD "tools/pyi_common.ps1")
          # 目录版：启动快，推荐普通用户
          & pyinstaller --onedir @PyiCommonArgs --name 'BilingualPdfTranslator' `
              --distpath dist --workpath build src/bi_app.py
          if ($LASTEXITCODE -ne 0) { throw "onedir build failed" }
          # 单文件版：只有一个 exe，便于转发；首次启动要解压，慢一些
          & pyinstaller --onefile @PyiCommonArgs --name 'BilingualPdfTranslator-onefile' `
              --distpath dist-one --workpath build-one src/bi_app.py
          if ($LASTEXITCODE -ne 0) { throw "onefile build failed" }

      - name: 冒烟测试（真跑一遍，并验证模型与术语表确实进了包）
        shell: pwsh
        run: |
          # 造一个 1 页测试 PDF
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,100),'The tumor microenvironment facilitates immune evasion in gastric cancer.', fontsize=11); d.save('sample.pdf')"

          $targets = @(
            @{ Name = 'onedir';  Exe = 'dist\BilingualPdfTranslator\BilingualPdfTranslator.exe' },
            @{ Name = 'onefile'; Exe = 'dist-one\BilingualPdfTranslator-onefile.exe' }
          )
          foreach ($t in $targets) {
            $data = Join-Path $PWD ("ci-data-" + $t.Name)
            $out  = Join-Path $PWD ("ci-out-"  + $t.Name)
            New-Item -ItemType Directory -Force -Path $data, $out | Out-Null

            # 关键：把 LOCALAPPDATA 指到一个空目录，逼程序走「首次运行」那条路径。
            # 不这么做的话，runner 上若已存在模型，会直接复用，等于什么都没测。
            $env:LOCALAPPDATA = $data
            $exeAbs = Join-Path $PWD $t.Exe
            $p = Start-Process -FilePath $exeAbs -ArgumentList @('--batch-out', $out, '--backend', 'local', (Join-Path $PWD 'sample.pdf')) -Wait -PassThru
            Write-Host "$($t.Name) exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$($t.Name): exit code not 0" }
            if (-not (Get-ChildItem $out -Filter *.pdf)) { throw "$($t.Name): no PDF produced" }

            # 证据一：随包的离线模型确实被解压出来了
            $bin = Join-Path $data 'BilingualPdfTranslator\model\translate-en_zh-1_9\model\model.bin'
            if (-not (Test-Path $bin)) { throw "$($t.Name): bundled model missing (model.bin not extracted)" }
            $mb = [math]::Round((Get-Item $bin).Length / 1MB, 1)
            Write-Host "$($t.Name) model.bin = $mb MB"

            # 证据二：术语表确实被载入（日志里会出现 biology.tsv）
            # 术语表缺失时程序不报错，只会写一行「没有找到术语表」——所以必须显式断言
            $log = Join-Path $data 'BilingualPdfTranslator\app.log'
            if (-not (Test-Path $log)) { throw "$($t.Name): app.log missing" }
            $txt = Get-Content $log -Raw -Encoding UTF8
            if ($txt -notmatch 'biology\.tsv') { throw "$($t.Name): glossary not loaded (assets/glossary not bundled)" }
            Write-Host "$($t.Name) glossary loaded OK"
          }

      - name: 压缩目录版（解压即用）
        shell: pwsh
        run: |
          Compress-Archive -Path dist/BilingualPdfTranslator -DestinationPath dist/BilingualPdfTranslator-windows.zip -CompressionLevel Optimal
          Get-ChildItem dist/BilingualPdfTranslator-windows.zip | Format-Table Name, Length

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bilingual-pdf-translator-windows
          path: |
            dist/BilingualPdfTranslator-windows.zip
            dist-one/*.exe

      - name: 挂到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BilingualPdfTranslator-windows.zip
            dist-one/*.exe
          body: |
            ## 双语 PDF 翻译器 ${{ github.ref_name }}

            两种形态，按喜好挑一个，**都不需要 Python、不需要配置环境变量、不需要联网**
            （离线模型与术语表都已在包内，首次运行自动安装到用户目录）。

            | 文件 | 用法 | 说明 |
            | --- | --- | --- |
            | `BilingualPdfTranslator-windows.zip` | 解压后双击里面的 exe | **推荐**。启动快（约 1 秒）。exe 旁边的 `_internal` 文件夹不能删。 |
            | `BilingualPdfTranslator-onefile.exe` | 双击即可 | 只有一个文件，便于转发。首次启动要把约 200 MB 解压到临时目录，会慢十几秒。 |

            详见 [README](https://github.com/${{ github.repository }}#readme)。
